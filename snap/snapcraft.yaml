name: doctoc
title: DocToc (UNOFFICIAL)
summary: Generates table of contents for markdown files of local git repo
description: |-
  Generates table of contents for markdown files inside local git repository.
  Links are compatible with anchors generated by GitHub or other sites.

  Refer to the upstream project website for more info about this application:

      thlorenz/doctoc: Generates table of contents for markdown files
      https://github.com/thlorenz/doctoc

  **Distribution-specific information**

  This is NOT an official distribution of doctoc, please file any issue
  regarding the usage of this snap to the snap's own issue tracker:

      Issues · 林博仁 Buo-ren Lin / Unofficial snap packaging for DocToc · GitLab
      https://gitlab.com/brlin/doctoc-snap/-/issues

license: MIT
contact: https://gitlab.com/brlin/doctoc-snap/-/issues
issues: https://gitlab.com/brlin/doctoc-snap/-/issues
source-code: https://gitlab.com/brlin/doctoc-snap
website: https://gitlab.com/brlin/doctoc-snap

base: core24
adopt-info: doctoc
grade: stable
confinement: strict
compression: lzo
platforms:
  amd64:
  arm64:
  armhf:
  ppc64el:
  riscv64:
  s390x:

apps:
  doctoc:
    command: bin/doctoc
    plugs:
      - home
      - removable-media

parts:
  doctoc:
    plugin: npm
    source: https://github.com/thlorenz/doctoc.git
    source-tag: v2.5.0
    npm-include-node: true
    npm-node-version: 22.23.2
    override-pull: |
      craftctl default
      craftctl set version="$(git describe --tags --always | sed -e 's/^v//')"
